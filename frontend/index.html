<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111513">
  <title>InoculAI | Scam intelligence workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261008">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">+</span><span>inocul<span class="brand-accent">ai</span></span></div>
      <div class="workspace-label">THREAT WORKSPACE</div>
      <nav class="nav-list" aria-label="Primary navigation">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">01</span>Overview</button>
        <button class="nav-item" data-view="scan"><span class="nav-icon">02</span>Scan message</button>
        <button class="nav-item" data-view="engage"><span class="nav-icon">03</span>AI engagement</button>
        <button class="nav-item" data-view="dna"><span class="nav-icon">04</span>Scam DNA</button>
        <button class="nav-item" data-view="graph"><span class="nav-icon">05</span>Campaign graph</button>
        <button class="nav-item" data-view="train"><span class="nav-icon">06</span>Train me</button>
        <button class="nav-item" data-view="campaigns"><span class="nav-icon">07</span>Campaigns</button>
        <button class="nav-item" data-view="automations"><span class="nav-icon">08</span>Automations</button>
      </nav>
      <div class="sidebar-foot">
        <div class="system-status"><span class="status-dot"></span><span>System nominal</span><small>MOCK MODE</small></div>
        <div class="user-chip"><span class="avatar">AN</span><span><b>Analyst</b><small>local workspace</small></span><span class="more">...</span></div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="breadcrumb"><span>INOCULAI</span><span class="slash">/</span><strong id="page-kicker">OVERVIEW</strong></div>
        <div class="top-actions"><span class="live-label"><i></i> LIVE ANALYSIS</span><button class="icon-button" aria-label="Notifications">!</button><button class="avatar small">AN</button></div>
      </header>
      <div id="app" class="page-container"></div>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js?v=20261008"></script>
</body>
</html>
